name: Build and Deploy to MonsterASP

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Create Environment Files
        run: |
          mkdir -p src/environments
          cat <<EOF > src/environments/environment.production.ts
          export const environment = {
            production: true,
            serverUrl: 'https://apicomponents.runasp.net',
            geminiApiKey: '${{ secrets.GEMINI_API_KEY }}'
          };
          EOF
          cat <<EOF > src/environments/environment.ts
          export const environment = {
            production: false,
            serverUrl: 'https://localhost:44364',
            geminiApiKey: ''
          };
          EOF

      - name: Build Project
        # Eliminamos el --base-href porque al ser SSR en servidor propio
        # usualmente se sirve desde la raíz '/'
        # FTP_SERVER, FTP_USERNAME y FTP_PASSWORD sus valores estan puestas el repositorio GitHub en Settings > Secrets and variables > Actions
        run: npx ng build --configuration production

      - name: Deploy to MonsterASP via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/e-commerce-v20/
          server-dir: ./wwwroot/
