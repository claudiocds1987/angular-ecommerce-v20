<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>ECommerceV20</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Google Fonts -->
    <!-- Preconnect to Google Fonts for performance optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <app-root>
      <!--  Simulacion de Skeleton por problema "cold start" del servidor, leer configuracion-SSR.md -->
      <div class="flex h-screen flex-col overflow-hidden">
        <!-- Header Skeleton -->
        <header
          class="bg-waves sticky top-0 z-50 flex items-center justify-between px-3 py-3 shadow-xl backdrop-blur-md sm:px-8 sm:py-4"
        >
          <div class="flex items-center gap-2 sm:gap-3">
            <div class="h-14 w-14 animate-pulse rounded-full bg-white/20"></div>
            <div class="hidden h-4 w-32 animate-pulse rounded bg-white/20 sm:block"></div>
          </div>
          <div class="flex items-center gap-1 sm:gap-2">
            <div class="h-8 w-16 animate-pulse rounded bg-white/20"></div>
            <div class="h-8 w-16 animate-pulse rounded bg-white/20"></div>
            <div class="h-10 w-10 animate-pulse rounded-full bg-white/20"></div>
          </div>
        </header>

        <!-- Main Content Skeleton -->
        <main class="flex-grow overflow-y-auto bg-slate-50">
          <div
            class="relative flex min-h-[250px] flex-col gap-6 bg-gray-50 p-4 lg:min-h-[calc(100vh-170px)] lg:flex-row"
          >
            <!-- Sidebar Filter Skeleton -->
            <aside class="hidden lg:block lg:w-80 lg:flex-shrink-0">
              <div
                class="h-[600px] w-full animate-pulse rounded-2xl border border-gray-100 bg-white p-4"
              >
                <div class="mb-6 h-6 w-32 rounded bg-slate-200"></div>
                <div class="mb-3 h-4 w-full rounded bg-slate-100"></div>
                <div class="mb-3 h-4 w-5/6 rounded bg-slate-100"></div>
                <div class="mb-6 h-4 w-4/6 rounded bg-slate-100"></div>
                <div class="mb-6 h-6 w-24 rounded bg-slate-200"></div>
                <div class="mb-3 h-4 w-full rounded bg-slate-100"></div>
                <div class="mb-3 h-4 w-full rounded bg-slate-100"></div>
              </div>
            </aside>

            <!-- Products List Skeleton -->
            <section class="flex flex-1 flex-col">
              <ul
                class="mt-6 grid list-none grid-cols-1 gap-6 p-0 sm:grid-cols-2 xl:grid-cols-3 2xl:grid-cols-4"
              >
                <!-- Item 1 -->
                <li>
                  <div
                    class="relative flex h-full animate-pulse flex-col justify-between rounded-xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6"
                  >
                    <div class="absolute top-3 right-3 h-5 w-20 rounded-md bg-slate-200"></div>
                    <div class="flex h-[180px] w-full items-center justify-center sm:h-[160px]">
                      <div class="h-32 w-32 rounded-lg bg-slate-200"></div>
                    </div>
                    <div class="mt-4 flex flex-grow flex-col sm:mt-6">
                      <div class="mb-2 h-3 w-16 rounded bg-slate-100"></div>
                      <div class="mt-1 space-y-2">
                        <div class="h-5 w-full rounded bg-slate-200"></div>
                        <div class="h-5 w-2/3 rounded bg-slate-200"></div>
                      </div>
                      <div class="mt-4 sm:mt-5">
                        <div class="h-8 w-24 rounded bg-slate-200"></div>
                      </div>
                    </div>
                    <div class="mt-6 flex justify-center">
                      <div class="h-10 w-32 rounded-lg bg-slate-200"></div>
                    </div>
                  </div>
                </li>
                <!-- Item 2 -->
                <li class="hidden sm:block">
                  <div
                    class="relative flex h-full animate-pulse flex-col justify-between rounded-xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6"
                  >
                    <div class="absolute top-3 right-3 h-5 w-20 rounded-md bg-slate-200"></div>
                    <div class="flex h-[180px] w-full items-center justify-center sm:h-[160px]">
                      <div class="h-32 w-32 rounded-lg bg-slate-200"></div>
                    </div>
                    <div class="mt-4 flex flex-grow flex-col sm:mt-6">
                      <div class="mb-2 h-3 w-16 rounded bg-slate-100"></div>
                      <div class="mt-1 space-y-2">
                        <div class="h-5 w-full rounded bg-slate-200"></div>
                        <div class="h-5 w-2/3 rounded bg-slate-200"></div>
                      </div>
                      <div class="mt-4 sm:mt-5">
                        <div class="h-8 w-24 rounded bg-slate-200"></div>
                      </div>
                    </div>
                    <div class="mt-6 flex justify-center">
                      <div class="h-10 w-32 rounded-lg bg-slate-200"></div>
                    </div>
                  </div>
                </li>
                <!-- Item 3 -->
                <li class="hidden xl:block">
                  <div
                    class="relative flex h-full animate-pulse flex-col justify-between rounded-xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6"
                  >
                    <div class="absolute top-3 right-3 h-5 w-20 rounded-md bg-slate-200"></div>
                    <div class="flex h-[180px] w-full items-center justify-center sm:h-[160px]">
                      <div class="h-32 w-32 rounded-lg bg-slate-200"></div>
                    </div>
                    <div class="mt-4 flex flex-grow flex-col sm:mt-6">
                      <div class="mb-2 h-3 w-16 rounded bg-slate-100"></div>
                      <div class="mt-1 space-y-2">
                        <div class="h-5 w-full rounded bg-slate-200"></div>
                        <div class="h-5 w-2/3 rounded bg-slate-200"></div>
                      </div>
                      <div class="mt-4 sm:mt-5">
                        <div class="h-8 w-24 rounded bg-slate-200"></div>
                      </div>
                    </div>
                    <div class="mt-6 flex justify-center">
                      <div class="h-10 w-32 rounded-lg bg-slate-200"></div>
                    </div>
                  </div>
                </li>
                <!-- Item 4 -->
                <li class="hidden 2xl:block">
                  <div
                    class="relative flex h-full animate-pulse flex-col justify-between rounded-xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6"
                  >
                    <div class="absolute top-3 right-3 h-5 w-20 rounded-md bg-slate-200"></div>
                    <div class="flex h-[180px] w-full items-center justify-center sm:h-[160px]">
                      <div class="h-32 w-32 rounded-lg bg-slate-200"></div>
                    </div>
                    <div class="mt-4 flex flex-grow flex-col sm:mt-6">
                      <div class="mb-2 h-3 w-16 rounded bg-slate-100"></div>
                      <div class="mt-1 space-y-2">
                        <div class="h-5 w-full rounded bg-slate-200"></div>
                        <div class="h-5 w-2/3 rounded bg-slate-200"></div>
                      </div>
                      <div class="mt-4 sm:mt-5">
                        <div class="h-8 w-24 rounded bg-slate-200"></div>
                      </div>
                    </div>
                    <div class="mt-6 flex justify-center">
                      <div class="h-10 w-32 rounded-lg bg-slate-200"></div>
                    </div>
                  </div>
                </li>
              </ul>
            </section>
          </div>
        </main>
      </div>
    </app-root>
  </body>
</html>
