<aside
  class="bg-waves-reverse sticky top-0 flex h-screen w-64 shrink-0 flex-col overflow-hidden text-slate-300 transition-all duration-300"
  [class.collapsed]="isSidebarCollapsed()"
>
  <!-- Cabecera del Sidebar -->
  <div class="flex items-center gap-2 border-b border-slate-500 px-5 py-5">
    <span class="sidebar-brand-text text-lg font-bold tracking-tight text-white">AdminPanel</span>
    <span
      class="sidebar-version rounded-md bg-blue-600 px-1.5 py-0.5 text-[10px] font-semibold tracking-wide text-white uppercase"
    >
      v2.0
    </span>
    <button
      type="button"
      (click)="toggleSidebar()"
      class="sidebar-toggle-button inline-flex h-9 w-9 items-center justify-center rounded-lg text-slate-500 transition-colors hover:bg-slate-100"
      aria-label="Alternar sidebar"
    >
      <i class="pi pi-bars text-xl text-white"></i>
    </button>
  </div>

  <!-- Navegación -->
  <nav class="flex-1 space-y-6 overflow-y-auto px-3 py-5">
    <div>
      <p
        class="sidebar-section-title mb-2 px-3 text-[10px] font-semibold tracking-widest text-white uppercase"
      >
        General
      </p>
      <ul class="space-y-1">
        <li>
          <button
            type="button"
            (click)="goToDashboard()"
            class="sidebar-item flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-medium text-white transition-colors hover:bg-blue-500 hover:text-white"
            [class.bg-blue-600]="isActive('/admin')"
            pTooltip="Dashboard"
            tooltipPosition="right"
            [tooltipDisabled]="!isSidebarCollapsed()"
          >
            <i class="pi pi-chart-bar sidebar-icon text-sm"></i>
            @if (!isSidebarCollapsed()) {
              <span class="sidebar-item-text">Dashboard</span>
            }
          </button>
        </li>
        <li>
          <button
            type="button"
            (click)="goToProducts()"
            class="sidebar-item flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-medium text-white transition-colors hover:bg-blue-500 hover:text-white"
            [class.bg-blue-600]="isActive('/admin/products-grid-admin')"
            pTooltip="Productos"
            tooltipPosition="right"
            [tooltipDisabled]="!isSidebarCollapsed()"
          >
            <i class="pi pi-box sidebar-icon text-sm"></i>
            @if (!isSidebarCollapsed()) {
              <span class="sidebar-item-text">Productos</span>
            }
          </button>
        </li>
        <li>
          <button
            type="button"
            (click)="goToExtraAttributes()"
            class="sidebar-item flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-medium text-white transition-colors hover:bg-blue-500 hover:text-white"
            [class.bg-blue-600]="isActive('/admin/product-extra-attribute-definition')"
            pTooltip="Atributos Extra"
            tooltipPosition="right"
            [tooltipDisabled]="!isSidebarCollapsed()"
          >
            <i class="pi pi-tags sidebar-icon text-sm"></i>
            @if (!isSidebarCollapsed()) {
              <span class="sidebar-item-text">Atributos Extra</span>
            }
          </button>
        </li>
        <li>
          <button
            type="button"
            class="sidebar-item flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-medium text-white transition-colors hover:bg-blue-500 hover:text-white"
            pTooltip="Clientes"
            tooltipPosition="right"
            [tooltipDisabled]="!isSidebarCollapsed()"
          >
            <i class="pi pi-users sidebar-icon text-sm"></i>
            @if (!isSidebarCollapsed()) {
              <span class="sidebar-item-text">Clientes</span>
            }
          </button>
        </li>
      </ul>
    </div>

    <div>
      <p
        class="sidebar-section-title mb-2 px-3 text-[10px] font-semibold tracking-widest text-white uppercase"
      >
        Analítica
      </p>
      <ul class="space-y-1">
        <li>
          <button
            type="button"
            class="sidebar-item flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-medium text-white transition-colors hover:bg-blue-500 hover:text-white"
            pTooltip="Reportes de Ventas"
            tooltipPosition="right"
            [tooltipDisabled]="!isSidebarCollapsed()"
          >
            <i class="pi pi-chart-line sidebar-icon text-sm"></i>
            @if (!isSidebarCollapsed()) {
              <span class="sidebar-item-text">Reportes de Ventas</span>
            }
          </button>
        </li>
        <li>
          <button
            type="button"
            (click)="goToExtraAttributes()"
            class="sidebar-item flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-medium text-white transition-colors hover:bg-blue-500 hover:text-white"
            [class.bg-blue-600]="isActive('/admin/product-extra-attribute-definition')"
            pTooltip="Atributos Extra"
            tooltipPosition="right"
            [tooltipDisabled]="!isSidebarCollapsed()"
          >
            <i class="pi pi-tags sidebar-icon text-sm"></i>
            @if (!isSidebarCollapsed()) {
              <span class="sidebar-item-text">Atributos Extra</span>
            }
          </button>
        </li>
        <li>
          <button
            type="button"
            class="sidebar-item flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-left text-sm font-medium text-white transition-colors hover:bg-blue-500 hover:text-white"
            pTooltip="Configuración"
            tooltipPosition="right"
            [tooltipDisabled]="!isSidebarCollapsed()"
          >
            <i class="pi pi-cog sidebar-icon text-sm"></i>
            @if (!isSidebarCollapsed()) {
              <span class="sidebar-item-text">Configuración</span>
            }
          </button>
        </li>
      </ul>
    </div>
  </nav>
</aside>
