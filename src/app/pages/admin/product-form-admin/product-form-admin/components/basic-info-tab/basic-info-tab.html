<div class="grid grid-cols-1 gap-6 p-6 lg:grid-cols-2">
  <!-- Datos del producto -->
  <div class="flex flex-col gap-5 rounded-2xl border border-slate-100 bg-slate-50/50 p-5">
    <div class="flex items-center gap-2 border-b border-slate-200/60 pb-3">
      <mat-icon class="text-indigo-600">inventory_2</mat-icon>
      <h3 class="text-sm font-semibold text-slate-800">Detalles Principales</h3>
    </div>
    <div class="product-form-admin__fields">
      <mat-form-field appearance="outline" class="w-full" [appSkeleton]="isLoading()">
        <mat-label>Título</mat-label>
        <input matInput type="text" [formField]="productForm().title" />
        <mat-error>
          <app-form-field-error [control]="productForm().title()" />
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full" [appSkeleton]="isLoading()">
        <mat-label>Descripción</mat-label>
        <textarea matInput [formField]="productForm().description" rows="5"></textarea>
        <mat-error>
          <app-form-field-error [control]="productForm().description()" />
        </mat-error>
      </mat-form-field>
    </div>
  </div>

  <!-- Multimedia (Thumbnail + Galería) -->
  <div class="flex flex-col gap-6">
    <!-- Thumbnail -->
    <div class="flex flex-col gap-4 rounded-2xl border border-slate-100 bg-slate-50/50 p-5">
      <div class="flex items-center gap-2 border-b border-slate-200/60 pb-3">
        <mat-icon class="text-pink-600">image</mat-icon>
        <h3 class="text-sm font-semibold text-slate-800">Imagen principal (thumbnail)</h3>
      </div>
      <div class="product-form-admin__fields">
        <div
          class="rounded-xl border-2 border-dashed border-slate-200 bg-white p-4 transition-colors hover:border-pink-300"
        >
          <app-upload-image
            [formField]="productForm().thumbnail"
            [maxFiles]="1"
            class="thumbnail-uploader"
          ></app-upload-image>
        </div>
        <mat-error>
          <app-form-field-error [control]="productForm().thumbnail()" />
        </mat-error>
      </div>
    </div>

    <!-- Galería de imágenes -->
    <div class="flex flex-col gap-4 rounded-2xl border border-slate-100 bg-slate-50/50 p-5">
      <div class="flex items-center gap-2 border-b border-slate-200/60 pb-3">
        <mat-icon class="text-indigo-500">collections</mat-icon>
        <h3 class="text-sm font-semibold text-slate-800">Galería de Imágenes</h3>
      </div>
      <div class="rounded-xl border border-slate-200 bg-white p-4">
        <app-upload-image [formField]="productForm().images"></app-upload-image>
      </div>
    </div>
  </div>
</div>
