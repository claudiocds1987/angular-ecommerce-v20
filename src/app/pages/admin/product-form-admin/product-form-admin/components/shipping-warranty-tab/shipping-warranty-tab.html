<div class="grid grid-cols-1 gap-6 p-6 lg:grid-cols-2">
  <!-- Políticas de Entrega -->
  <div class="flex flex-col gap-5 rounded-2xl border border-slate-100 bg-slate-50/50 p-5">
    <div class="flex items-center gap-2 border-b border-slate-200/60 pb-3">
      <mat-icon class="text-amber-600">local_shipping</mat-icon>
      <h3 class="text-sm font-semibold text-slate-800">Logística de Envío</h3>
    </div>
    <div class="product-form-admin__fields">
      <mat-form-field appearance="outline" class="w-full" [appSkeleton]="isLoading()">
        <mat-label>Información de Envío</mat-label>
        <input
          matInput
          type="text"
          [formField]="productForm().shippingInformation"
          placeholder="Ej: Envío en 24-48 horas"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full" [appSkeleton]="isLoading()">
        <mat-label>Política de Devoluciones</mat-label>
        <input
          matInput
          type="text"
          [formField]="productForm().returnPolicy"
          placeholder="Ej: 30 días de devolución gratis"
        />
      </mat-form-field>
    </div>
  </div>

  <!-- Garantía y Disponibilidad -->
  <div class="flex flex-col gap-5 rounded-2xl border border-slate-100 bg-slate-50/50 p-5">
    <div class="flex items-center gap-2 border-b border-slate-200/60 pb-3">
      <mat-icon class="text-amber-700">verified</mat-icon>
      <h3 class="text-sm font-semibold text-slate-800">Garantía y Disponibilidad</h3>
    </div>
    <div class="product-form-admin__fields">
      <mat-form-field appearance="outline" class="w-full" [appSkeleton]="isLoading()">
        <mat-label>Garantía</mat-label>
        <input
          matInput
          type="text"
          [formField]="productForm().warrantyInformation"
          placeholder="Ej: 1 año de garantía oficial"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full" [appSkeleton]="isLoading()">
        <mat-label>Estado de Disponibilidad</mat-label>
        <mat-select [formField]="productForm().availabilityStatus">
          <mat-option value="instock">En stock (In stock)</mat-option>
          <mat-option value="lowstock">Poco stock (Low stock)</mat-option>
          <mat-option value="outofstock">Agotado (Out of stock)</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>
</div>
