<div class="flex flex-col justify-center bg-gray-50 py-12 sm:px-6 lg:px-8">
  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="border border-gray-100 bg-white px-4 py-8 shadow-xl sm:rounded-lg sm:px-10">
      <!-- Icon Wrapper -->
      <div
        class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full transition-all duration-300 ease-in-out"
        [ngClass]="{
          'bg-green-100': config.class === 'approved',
          'bg-red-100': config.class === 'rejected',
          'bg-yellow-100': config.class === 'pending',
        }"
      >
        @switch (config.class) {
          @case ('approved') {
            <!-- Check Icon -->
            <svg
              class="h-10 w-10 text-green-600"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 13l4 4L19 7"
              />
            </svg>
          }
          @case ('rejected') {
            <!-- X Icon -->
            <svg
              class="h-10 w-10 text-red-600"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          }
          @case ('pending') {
            <!-- Clock Icon -->
            <svg
              class="h-10 w-10 animate-pulse text-yellow-600"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
          }
        }
      </div>

      <div class="mb-6 sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="text-center text-3xl font-extrabold tracking-tight text-gray-900">
          {{ config.title }}
        </h2>
        <p class="mt-2 text-center text-sm text-gray-600">
          {{ config.message }}
        </p>
      </div>

      <!-- Payment ID -->
      @if (paymentId) {
        <div class="mt-6 border-t border-gray-100 pt-4">
          <p class="text-center text-xs font-semibold tracking-wide text-gray-500 uppercase">
            ID de Operación
          </p>
          <p class="mt-1 text-center font-mono text-sm text-gray-900 select-all">
            {{ paymentId }}
          </p>
        </div>
      }

      <div class="mt-8">
        <button
          routerLink="/"
          class="group relative flex w-full transform justify-center rounded-md border border-transparent bg-indigo-600 px-4 py-3 text-sm font-medium text-white transition-all duration-200 ease-in-out hover:-translate-y-0.5 hover:bg-indigo-700 hover:shadow-lg focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:outline-none"
        >
          <span class="absolute inset-y-0 left-0 flex items-center pl-3">
            <svg
              class="h-5 w-5 text-indigo-500 transition-colors duration-200 group-hover:text-indigo-400"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 20 20"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                fill-rule="evenodd"
                d="M9.707 14.707a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 1.414L7.414 9H15a1 1 0 110 2H7.414l2.293 2.293a1 1 0 010 1.414z"
                clip-rule="evenodd"
              />
            </svg>
          </span>
          Volver a la Tienda
        </button>
      </div>
    </div>
  </div>
</div>
