<div
  class="bg-waves sticky max-h-[calc(100vh-48px)] overflow-y-auto rounded-2xl border border-gray-100 p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)]"
>
  <div class="mb-8 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="rounded-lg bg-indigo-50 p-2">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"
          />
        </svg>
      </div>
      <h3 class="text-xl font-extrabold tracking-tight text-white">Filtros</h3>
    </div>

    <button
      type="button"
      (click)="toggleSidebar.emit(true)"
      class="rounded-xl border border-transparent p-2 text-white transition-all duration-200 hover:border-gray-200 hover:bg-gray-50 hover:text-gray-600"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M11 19l-7-7 7-7m8 14l-7-7 7-7"
        />
      </svg>
    </button>
  </div>

  <form [formGroup]="filterForm" (ngSubmit)="applyFilters()" class="flex flex-col gap-7">
    <label class="group flex flex-col gap-2.5">
      <span class="ml-1 text-[11px] font-bold tracking-[0.1em] text-white uppercase"
        >Palabra clave</span
      >
      <div class="relative">
        <input
          type="text"
          formControlName="search"
          class="w-full rounded-2xl border border-gray-200 bg-white py-3 pr-4 pl-11 text-gray-700 shadow-sm transition-all duration-200 outline-none placeholder:text-gray-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10"
          placeholder="Ej: Smart TV..."
        />
        <span
          class="absolute top-1/2 left-4 -translate-y-1/2 text-white transition-colors group-focus-within:text-indigo-500"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
        </span>
      </div>
    </label>

    <fieldset class="m-0 flex flex-col gap-2.5 border-none p-0">
      <legend class="mb-1 ml-1 text-[11px] font-bold tracking-[0.1em] text-white uppercase">
        Presupuesto
      </legend>
      <div class="grid grid-cols-2 gap-3">
        <div class="relative">
          <span class="absolute top-1/2 left-4 -translate-y-1/2 text-sm text-white">$</span>
          <input
            type="number"
            formControlName="minPrice"
            placeholder="Mín"
            class="w-full rounded-2xl border border-gray-200 bg-white py-3 pr-3 pl-8 text-gray-700 shadow-sm transition-all outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10"
          />
        </div>
        <div class="relative">
          <span class="absolute top-1/2 left-4 -translate-y-1/2 text-sm text-white">$</span>
          <input
            type="number"
            formControlName="maxPrice"
            placeholder="Máx"
            class="w-full rounded-2xl border border-gray-200 bg-white py-3 pr-3 pl-8 text-gray-700 shadow-sm transition-all outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10"
          />
        </div>
      </div>
    </fieldset>

    <label class="flex flex-col gap-2.5">
      <span class="ml-1 text-[11px] font-bold tracking-[0.1em] text-white uppercase"
        >Categoría</span
      >
      <div class="relative">
        <select
          formControlName="categoryId"
          class="w-full cursor-pointer appearance-none rounded-2xl border border-gray-200 bg-white px-4 py-3 text-gray-700 shadow-sm transition-all outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10"
        >
          <option value="">Todas las categorías</option>
          @for (category of categories.items(); track category.id) {
            <option [value]="category.id">{{ category.name }}</option>
          }
        </select>
        <span class="pointer-events-none absolute top-1/2 right-4 -translate-y-1/2 text-gray-400">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </span>
      </div>
    </label>

    <label class="flex flex-col gap-2.5">
      <span class="ml-1 text-[11px] font-bold tracking-[0.1em] text-white uppercase"
        >Ordenar por</span
      >
      <div class="relative">
        <select
          formControlName="sortBy"
          class="w-full cursor-pointer appearance-none rounded-2xl border border-gray-200 bg-white px-4 py-3 text-gray-700 shadow-sm transition-all outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10"
        >
          <option value="title">Nombre (A - Z)</option>
          <option value="price">Menor precio</option>
          <option value="rating">Más populares</option>
        </select>
        <span class="pointer-events-none absolute top-1/2 right-4 -translate-y-1/2 text-gray-400">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-4 w-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 9l4-4 4 4m0 6l-4 4-4-4"
            />
          </svg>
        </span>
      </div>
    </label>

    <div class="flex flex-col gap-3 border-t border-gray-100/10 pt-6">
      <!-- Botón: Aplicar Filtros (Actualizado con bg-cyan, shadow-cyan e icono Check) -->
      <button
        type="submit"
        class="flex w-full cursor-pointer items-center justify-center gap-3 rounded-2xl bg-cyan-500 py-4 font-bold text-white shadow-lg shadow-cyan-500/20 transition-all duration-200 hover:bg-cyan-600 active:scale-[0.98]"
      >
        <!-- Icono Check -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
        Aplicar Filtros
      </button>

      <!-- Botón: Limpiar selección (Actualizado con hover translúcido e icono Papelera) -->
      <button
        type="button"
        (click)="clearFilters()"
        class="flex w-full cursor-pointer items-center justify-center gap-2.5 rounded-xl py-3 text-center text-sm font-medium text-white/90 transition-all hover:bg-white/10 hover:text-white"
      >
        <!-- Icono Papelera -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-4 w-4"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
          />
        </svg>
        Limpiar selección
      </button>
    </div>
  </form>
</div>
