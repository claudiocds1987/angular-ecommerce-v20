@if (config()) {
  <div
    class="fixed bottom-4 left-1/2 z-[9999] flex w-[94%] -translate-x-1/2 flex-col overflow-hidden rounded-xl border px-5 py-4 shadow-2xl backdrop-blur-md transition-all duration-500 ease-out sm:w-auto sm:max-w-[500px] sm:min-w-[350px] md:bottom-8 md:rounded-2xl"
    [ngClass]="[
      typeStyles[config()!.type],
      showAnimation() ? 'translate-y-0 scale-100 opacity-100' : 'translate-y-8 scale-95 opacity-0',
    ]"
  >
    <div class="flex items-center justify-between gap-4">
      <div class="flex min-w-0 items-center gap-3">
        <div class="flex-shrink-0">
          @switch (config()!.type) {
            @case ('success') {
              <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
                />
              </svg>
            }
            @case ('danger') {
              <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                />
              </svg>
            }
            @case ('warning') {
              <svg class="h-6 w-6 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
                />
              </svg>
            }
          }
        </div>

        <span class="text-sm leading-tight font-semibold tracking-wide md:text-base">
          {{ config()!.message }}
        </span>
      </div>

      <button
        (click)="close()"
        class="flex-shrink-0 rounded-full p-2 transition-colors hover:bg-white/20 active:scale-90"
      >
        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <div class="absolute bottom-0 left-0 h-1 w-full bg-white/10">
      <div
        class="h-full bg-white/40 transition-all duration-[3000ms] ease-linear"
        [style.width]="showAnimation() ? '0%' : '100%'"
      ></div>
    </div>
  </div>
}
